<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RemoteCode">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="0.8" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161d3d"/>
      <stop offset="1" stop-color="#0a0f22"/>
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a99eff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- خلفية التطبيق: تدرّج واحد متّصل بدل شبكة النقاط والهالات المتعدّدة -->
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>

  <!-- جسم الهاتف وشاشته. الشاشة أغمق من التدرّج عند الزاوية الساطعة حتى
       يبقى ظلّ الجهاز ظاهرًا، والتقليل من التفاصيل (لا زرّ هوم ولا ظلّ) يحفظ
       وضوح الأيقونة عند مقاسات الـ favicon الصغيرة. -->
  <rect x="154" y="82" width="204" height="348" rx="54" fill="#05070f" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  <rect x="166" y="96" width="180" height="320" rx="42" fill="url(#screen)"/>
  <rect x="224" y="106" width="64" height="12" rx="6" fill="#05070f"/>

  <!-- سطرا كود مختصران فوق الفقاعة بدل خمسة أشرطة مبعثرة -->
  <g stroke-linecap="round">
    <rect x="188" y="138" width="76" height="12" rx="6" fill="#8b7cff"/>
    <rect x="274" y="138" width="44" height="12" rx="6" fill="#38bdf8" opacity="0.7"/>
    <rect x="188" y="160" width="118" height="9" rx="4.5" fill="#ffffff" opacity="0.16"/>
  </g>

  <!-- الفقاعة هي العنصر البصري المهيمن: حجم أكبر وحدود أوضح، والرمز </>
       بسماكة أكبر ليبقى مقروءًا حتى في 16px. -->
  <rect x="184" y="190" width="148" height="112" rx="30" fill="#f5f3ff"/>
  <path d="M214 300 L202 324 L240 302 Z" fill="#f5f3ff"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226 222 L206 246 L226 270" stroke="#6d5ef0" stroke-width="17"/>
    <path d="M290 222 L310 246 L290 270" stroke="#0ea5e9" stroke-width="17"/>
    <path d="M276 214 L242 278" stroke="url(#code)" stroke-width="14"/>
  </g>

  <!-- سطر أوامر أسفل الشاشة: يستبدل نقاط الكتابة والزرّ القديمين ويؤكّد
       الهوية البرمجية بعنصر واحد بسيط -->
  <rect x="188" y="334" width="136" height="42" rx="21" fill="#ffffff" opacity="0.06"/>
  <path d="M212 346 L226 355 L212 364" fill="none" stroke="#8b7cff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="240" y="352" width="22" height="6" rx="3" fill="#38bdf8"/>

  <!-- لمعة زجاجية واحدة وإطار رفيع بدل تراكب الشفافيات والظلال الثقيلة -->
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
</svg>
